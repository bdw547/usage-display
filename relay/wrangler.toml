name = "usage-relay"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# SQLite-backed Durable Object (the only DO flavor on the free plan). One instance
# holds every machine's latest snapshot; see the note above UsageStore in worker.js.
[[durable_objects.bindings]]
name = "USAGE_DO"
class_name = "UsageStore"

[[migrations]]
tag = "v2-durable-object"
new_sqlite_classes = ["UsageStore"]

[observability]
enabled = true
